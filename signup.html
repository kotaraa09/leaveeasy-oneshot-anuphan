<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">สร้างบัญชีใหม่เพื่อเข้าใช้ระบบ</p>

    <div class="card" style="max-width: 400px; margin: 0 auto;">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัครสมาชิก">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" placeholder="เช่น สมชาย ใจดี" required>

        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="example@mail.com" required>

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="รหัสผ่านอย่างน้อย 6 ตัวอักษร" required>

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัครสมาชิก">สมัครสมาชิก</button>
        </div>
      </form>

      <p style="text-align: center; margin-top: 18px;">
        มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a>
      </p>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
